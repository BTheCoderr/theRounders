[build]
  base = "native"
  command = "npm run build"
  publish = ".next"

[functions]
  directory = "netlify/functions"


# Explicit UTC schedules ensure scheduled functions are registered by Netlify.
# Import and research comparison are deliberately separate to avoid 30s timeouts.
[functions."rounders-history-nba"]
  schedule = "0 */3 * * *"
[functions."rounders-history-nfl"]
  schedule = "15 */3 * * *"
[functions."rounders-history-nhl"]
  schedule = "30 */3 * * *"
[functions."rounders-history-mlb"]
  schedule = "45 */3 * * *"

[functions."rounders-evaluation-nba"]
  schedule = "0 14 * * *"
[functions."rounders-evaluation-nfl"]
  schedule = "15 14 * * *"
[functions."rounders-evaluation-nhl"]
  schedule = "30 14 * * *"
[functions."rounders-evaluation-mlb"]
  schedule = "45 14 * * *"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY_NEXT_PLUGIN_SKIP = "false"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[build]
  base = "native"
  command = "npm run build"
  publish = ".next"
  # Skip production builds unless the web app or this file changed (saves build credits).
  # Netlify runs this from the base directory; exit 0 = skip, exit 1 = build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml"

# No deploy previews or branch deploys: CI already builds and tests every PR.
[context.deploy-preview]
  ignore = "exit 0"
[context.branch-deploy]
  ignore = "exit 0"

[functions]
  directory = "netlify/functions"


# Explicit UTC schedules ensure scheduled functions are registered by Netlify.
# Import and research comparison are deliberately separate to avoid 30s timeouts.
[functions."rounders-history-nba"]
  schedule = "0 */3 * * *"
[functions."rounders-history-nfl"]
  schedule = "15 */3 * * *"
[functions."rounders-history-nhl"]
  schedule = "30 */3 * * *"
[functions."rounders-history-mlb"]
  schedule = "45 */3 * * *"
[functions."rounders-history-ncaam"]
  schedule = "5,25,45 * * * *"
[functions."rounders-history-ncaaf"]
  schedule = "10,30,50 * * * *"
# One-time deep history toward 1980 (History pages); idles once every sport hits its feed floor.
[functions."rounders-deep-history"]
  schedule = "*/10 * * * *"

[functions."rounders-evaluation-nba"]
  schedule = "0 14 * * *"
[functions."rounders-evaluation-nfl"]
  schedule = "15 14 * * *"
[functions."rounders-evaluation-nhl"]
  schedule = "30 14 * * *"
[functions."rounders-evaluation-mlb"]
  schedule = "45 14 * * *"

# Prediction engine (all six sports): snapshots before games, grading after, daily backtests.
[functions."rounders-predict-nba"]
  schedule = "20 15 * * *"
[functions."rounders-predict-nfl"]
  schedule = "25 15 * * *"
[functions."rounders-grade"]
  schedule = "50 */3 * * *"
[functions."rounders-backtest-nba"]
  schedule = "5 13 * * *"
[functions."rounders-backtest-nfl"]
  schedule = "20 13 * * *"
[functions."rounders-predict-ncaam"]
  schedule = "10 15 * * *"
[functions."rounders-predict-ncaaf"]
  schedule = "30 15 * * *"
[functions."rounders-predict-nhl"]
  schedule = "35 15 * * *"
[functions."rounders-predict-mlb"]
  schedule = "40 15 * * *"
[functions."rounders-backtest-ncaam"]
  schedule = "35 13 * * *"
[functions."rounders-backtest-ncaaf"]
  schedule = "50 13 * * *"
[functions."rounders-backtest-nhl"]
  schedule = "35 12 * * *"
[functions."rounders-backtest-mlb"]
  schedule = "50 12 * * *"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY_NEXT_PLUGIN_SKIP = "false"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

name: therounders iOS TestFlight (manual)
on:
  workflow_dispatch:
    inputs:
      submit_to_testflight:
        description: "Also submit signed iOS build to Apple TestFlight"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: rounders-ios-manual-release
  cancel-in-progress: false

jobs:
  signed-ios:
    name: Signed iOS build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Confirm EAS project and reviewed iOS app icon
        env:
          SUBMIT_TO_TESTFLIGHT: ${{ inputs.submit_to_testflight }}
        run: |
          if [ "$SUBMIT_TO_TESTFLIGHT" = "true" ]; then
            node scripts/release-preflight.mjs --submit
          else
            node scripts/release-preflight.mjs
          fi

      - name: Confirm Expo authorization
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository Actions secret from your Expo account before running the workflow."
            exit 1
          fi

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install and validate
        run: |
          npm ci --legacy-peer-deps
          npm run typecheck
          npx expo install --check
          npx --yes expo-doctor

      - name: Build store-signed iOS app
        env:
          SUBMIT_TO_TESTFLIGHT: ${{ inputs.submit_to_testflight }}
        run: |
          if [ "$SUBMIT_TO_TESTFLIGHT" = "true" ]; then
            echo "Submitting to TestFlight after a successful build."
            eas build --platform ios --profile production --non-interactive --auto-submit --wait
          else
            echo "Build only. This run will NOT submit anything to Apple."
            eas build --platform ios --profile production --non-interactive --wait
          fi

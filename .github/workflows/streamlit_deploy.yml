name: Legacy Streamlit syntax checks
on:
  push:
    branches: [ main ]
    paths:
      - "**/*.py"
      - "requirements.txt"
      - ".github/workflows/streamlit_deploy.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "**/*.py"
      - "requirements.txt"
      - ".github/workflows/streamlit_deploy.yml"
permissions:
  contents: read
jobs:
  validate-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The old workflow attempted to "deploy" by launching a blocking
      # Streamlit server in CI, and unnecessarily required private provider
      # keys for every unrelated mobile UI pull request.
      # Real Streamlit hosting deployment is managed separately.
      - name: Syntax check legacy Python research modules
        run: python -m compileall -q app.py sports_betting data_integration

name: Rounders mobile Expo checks
on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/rounders-mobile-ci.yml"
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/rounders-mobile-ci.yml"
permissions:
  contents: read
jobs:
  expo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Expo dependencies
        run: npm ci --legacy-peer-deps
      - name: Verify release installer syntax and icon readiness
        run: |
          bash -n scripts/install-approved-icon.sh
          if [ -f assets/icon.png ]; then
            npm run preflight:ios
          else
            if node scripts/release-preflight.mjs >/tmp/rounders-preflight.txt 2>&1; then
              echo "::error::Release preflight unexpectedly passed without an approved app icon."
              exit 1
            fi
            grep -q "Approved sports-R icon" /tmp/rounders-preflight.txt
            echo "Icon intentionally pending: correct missing-asset release guard verified."
          fi
      - name: TypeScript native checks
        run: npm run typecheck
      - name: Simulated market integrity regression tests
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Verify Expo SDK dependencies
        run: npx expo install --check
      - name: Expo doctor
        run: npx --yes expo-doctor
      - name: Export iOS JavaScript bundle
        run: npx expo export --platform ios --output-dir /tmp/rounders-ios
      - name: Export Android JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/rounders-android

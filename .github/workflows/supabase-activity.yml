name: Supabase project activity checks
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8,16,23 * * *'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check configured project databases
        env:
          TARGETS_JSON: ${{ secrets.SUPABASE_HEALTH_TARGETS_JSON }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,sys
          targets=json.loads(os.environ.get("TARGETS_JSON") or "[]")
          if not targets:
              sys.exit("No targets configured. Add SUPABASE_HEALTH_TARGETS_JSON repository secret.")
          failures=[]
          for target in targets:
              name=target.get("name","unnamed")
              url=target["url"].rstrip("/")+"/rest/v1/rpc/rounders_healthcheck"
              key=target["key"]
              req=urllib.request.Request(url,data=b"{}",method="POST",headers={"apikey":key,"Authorization":"Bearer "+key,"Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=20) as response:
                      if response.status!=200: raise ValueError("Unexpected HTTP status")
                      print(name+": healthy")
              except Exception as exc:
                  print(name+": FAILED "+type(exc).__name__)
                  failures.append(name)
          if failures: sys.exit("Database checks failed: "+", ".join(failures))
          PY

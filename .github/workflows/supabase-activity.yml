name: Supabase project activity checks
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8,16,23 * * *'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check configured project databases
        env:
          TARGETS_JSON: ${{ secrets.SUPABASE_HEALTH_TARGETS_JSON }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,sys
          targets=json.loads(os.environ.get("TARGETS_JSON") or "[]")
          if not targets:
              print("No targets configured. Add SUPABASE_HEALTH_TARGETS_JSON repository secret.")
              sys.exit(1)
          failures=[]
          for target in targets:
              name=target.get("name","unnamed")
              url=target["url"].rstrip("/")+"/rest/v1/"+target["table"]+"?select="+target["column"]+"&limit=1"
              key=target["key"]
              req=urllib.request.Request(url,headers={"apikey":key,"Authorization":"Bearer "+key})
              try:
                  with urllib.request.urlopen(req,timeout=20) as response:
                      print(name+": HTTP "+str(response.status))
              except Exception as exc:
                  print(name+": FAILED "+type(exc).__name__)
                  failures.append(name)
          if failures:
              sys.exit("Database checks failed: "+", ".join(failures))
          PY

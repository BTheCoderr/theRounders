name: Generate Rounders Expo lockfile
on:
  push:
    branches:
      - fix/rounders-mobile-product-20261013
    paths:
      - ".github/workflows/rounders-lockfile.yml"
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve and commit mobile package-lock
        run: |
          cd mobile
          npm install --package-lock-only --legacy-peer-deps --ignore-scripts
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(mobile): lock Expo SDK 54 dependencies'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
